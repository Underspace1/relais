<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Relais</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Great+Vibes&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try {
      const p = JSON.parse(localStorage.getItem('relais-prefs') || '{}');
      if (p.theme && p.theme !== 'auto') document.documentElement.dataset.theme = p.theme;
      if (p.fontSize) document.documentElement.dataset.size = p.fontSize;
      if (p.width) document.documentElement.dataset.width = p.width;
      document.documentElement.dataset.chatFont = p.chatFont || 'serif';
      if (p.splash === false || sessionStorage.getItem('relais-splash')) document.documentElement.classList.add('no-splash');
    } catch {}
  </script>
</head>
<body>
  <!-- Animation d'ouverture : le « R » se trace, les trois IA s'allument, « Relais » s'écrit en signature -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-inner">
      <svg class="splash-logo" viewBox="0 0 64 64">
        <defs>
          <linearGradient id="sp-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#252422"/><stop offset="1" stop-color="#0e0e10"/></linearGradient>
          <linearGradient id="sp-ink" gradientUnits="userSpaceOnUse" x1="20" y1="50" x2="44" y2="18"><stop offset="0" stop-color="#e07a4f"/><stop offset=".25" stop-color="#e07a4f"/><stop offset=".75" stop-color="#22b083"/><stop offset="1" stop-color="#7fd9b8"/></linearGradient>
        </defs>
        <rect class="sp-bg" width="64" height="64" rx="15" fill="url(#sp-bg)"/>
        <g transform="translate(-0.5 -1.5)">
          <path class="sp-path" pathLength="1" d="M21 49V22.5Q21 16 27.5 16H32.5A11 11 0 0 1 32.5 38H27L44 49" fill="none" stroke="url(#sp-ink)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
          <g stroke="#171716" stroke-width="2">
            <circle class="sp-node n1" cx="21" cy="49" r="4.6" fill="#e07a4f"/>
            <circle class="sp-node n2" cx="43.5" cy="27" r="4.6" fill="#22b083"/>
            <circle class="sp-node n3" cx="44" cy="49" r="4.6" fill="#ecebe6"/>
          </g>
        </g>
      </svg>
      <svg class="splash-sign" viewBox="0 0 360 120">
        <defs>
          <linearGradient id="sp-reveal" x1="0" x2="1"><stop offset=".85" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <mask id="sp-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="360" height="120"><rect class="sp-reveal" x="0" y="0" width="360" height="120" fill="url(#sp-reveal)"/></mask>
        </defs>
        <g mask="url(#sp-mask)">
          <text class="sp-text" x="180" y="78" text-anchor="middle">Relais</text>
          <path class="sp-flourish" pathLength="1" d="M70 96C130 90 210 88 300 94" fill="none"/>
        </g>
      </svg>
      <p class="splash-tag">Claude, ChatGPT, Grok, Gemini et Perplexity, ensemble.</p>
    </div>
  </div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <div class="brand">
          <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg-ink" gradientUnits="userSpaceOnUse" x1="20" y1="50" x2="44" y2="18"><stop offset="0" stop-color="#e07a4f"/><stop offset=".25" stop-color="#e07a4f"/><stop offset=".75" stop-color="#22b083"/><stop offset="1" stop-color="#7fd9b8"/></linearGradient></defs><rect width="64" height="64" rx="15" class="logo-bg"/><g transform="translate(-0.5 -1.5)"><path d="M21 49V22.5Q21 16 27.5 16H32.5A11 11 0 0 1 32.5 38H27L44 49" fill="none" stroke="url(#lg-ink)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><g class="logo-ring" stroke-width="2.4"><circle cx="21" cy="49" r="5" fill="#e07a4f"/><circle cx="43.5" cy="27" r="5" fill="#22b083"/><circle cx="44" cy="49" r="5" fill="#ecebe6"/></g></g></svg>
          <span class="brand-name">Relais</span>
        </div>
        <button class="icon-btn" id="sideClose" type="button" aria-label="Masquer la barre latérale" title="Masquer la barre latérale (Ctrl B)">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
        </button>
      </div>

      <nav class="side-nav">
        <button class="nav-item new-chat" id="newChat" type="button" title="Nouvelle conversation (Ctrl Maj O)">
          <span class="plus-badge"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span><span>Nouvelle conversation</span>
        </button>
        <button class="nav-item" id="openConvs" type="button" title="Toutes les conversations (Ctrl K pour chercher)">
          <svg viewBox="0 0 24 24"><path d="M20 12.5a7.5 7.5 0 0 1-11 6.6L4.5 20l1-4A7.5 7.5 0 1 1 20 12.5z"/></svg><span>Conversations</span>
        </button>
        <button class="nav-item" id="openProjects" type="button">
          <svg viewBox="0 0 24 24"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span>Projets</span>
        </button>
        <button class="nav-item" id="openDesigns" type="button" title="Designs et images créés dans Relais">
          <svg viewBox="0 0 24 24"><path d="M12 3.5l7.5 4.2v8.6L12 20.5l-7.5-4.2V7.7z"/><path d="M4.5 7.7L12 12l7.5-4.3M12 12v8.5"/></svg><span>Artefacts</span>
        </button>
        <button class="nav-item" id="openSkills" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"/></svg>
          <span>Skills</span><span class="count" id="skillCount"></span>
        </button>
      </nav>

      <div class="conv-list" id="convList" aria-label="Conversations"></div>

      <div class="side-foot">
        <button class="profile-btn" id="profileBtn" type="button" aria-haspopup="menu" title="Profil, connexions et réglages"></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="icon-btn only-desktop" id="sideToggle" type="button" aria-label="Masquer la barre latérale" title="Barre latérale (Ctrl B)">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
        </button>
        <button class="project-btn" id="projectBtn" type="button" title="Choisir le projet sur lequel les IA travaillent"></button>
        <button class="branch-btn" id="branchBtn" type="button" title="Git : état du projet" hidden></button>
        <button class="title-btn" id="convMenuBtn" type="button" aria-haspopup="menu" title="Actions de la conversation">
          <span class="incog-badge" id="incogBadge" hidden title="Conversation privée"><svg viewBox="0 0 24 24"><path d="M4 11h16M6.5 11l1.5-5.5h8l1.5 5.5"/><circle cx="8" cy="16" r="2.6"/><circle cx="16" cy="16" r="2.6"/><path d="M10.6 16h2.8"/></svg></span>
          <h1 class="conv-title" id="convTitle">Nouvelle conversation</h1>
          <svg class="chev-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
        </button>
        <span class="spacer"></span>
        <div class="top-agents" id="topAgents" aria-hidden="true"></div>
        <button class="icon-btn" id="incogBtn" type="button" aria-pressed="false" title="Conversation privée : rien n’est enregistré ni mémorisé (Ctrl Maj I)">
          <svg viewBox="0 0 24 24"><path d="M4 11h16M6.5 11l1.5-5.5h8l1.5 5.5"/><circle cx="8" cy="16" r="2.6"/><circle cx="16" cy="16" r="2.6"/><path d="M10.6 16h2.8"/></svg>
        </button>
        <button class="icon-btn" id="shareBtn" type="button" title="Exporter la conversation en Markdown (Ctrl Maj E)">
          <svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
        </button>
        <button class="icon-btn" id="panelToggle" type="button" aria-label="Panneau de travail" title="Panneau : tâches, modifications, Git (Ctrl J)">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15"/></svg>
        </button>
      </header>

      <section class="thread" id="thread">
        <div class="thread-inner" id="threadInner"></div>
      </section>

      <footer class="composer-wrap">
        <div class="popover" id="popover" hidden></div>
        <div class="queue" id="queue" hidden></div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="drop-hint" aria-hidden="true">Dépose tes fichiers ici</div>
          <div class="attach-list" id="attachList" hidden></div>
          <div class="chips" id="chips" hidden></div>
          <div class="voice-live" id="voiceLive" hidden>
            <span class="vu" id="vu"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span class="voice-text" id="voiceText">Je t’écoute…</span>
            <span class="voice-time" id="voiceTime">0:00</span>
            <button type="button" class="btn sm" id="voiceCancel">Annuler</button>
            <button type="button" class="btn sm primary" id="voiceStop">Terminer</button>
          </div>
          <textarea id="input" rows="1" placeholder="Écris à Claude…" aria-label="Message"></textarea>
          <div class="toolbar">
            <button type="button" class="tool-btn icon-only" id="attachBtn" title="Joindre des fichiers, une capture d’écran (glisser-déposer, Ctrl V)" aria-label="Joindre">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <input type="file" id="fileInput" multiple hidden>
            <button type="button" class="tool-btn icon-only" id="toolsBtn" title="Outils : recherche, réflexion, style, relais, skills" aria-label="Outils" aria-haspopup="menu">
              <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
            </button>
            <button type="button" class="tool-btn perm-btn" id="permBtn" hidden></button>
            <span class="active-tools" id="activeTools"></span>
            <!-- Commandes d'origine, pilotées par le menu Outils (gardées pour les raccourcis et l'état) -->
            <span class="legacy-tools" aria-hidden="true">
              <button type="button" class="tool-btn" id="relayBtn" tabindex="-1"><span>Relais</span></button>
              <button type="button" class="tool-btn" id="skillBtn" tabindex="-1"><span>Skill</span></button>
              <button type="button" class="tool-btn effort-btn" id="effortBtn" tabindex="-1" hidden></button>
              <button type="button" class="tool-btn style-btn" id="styleBtn" tabindex="-1"></button>
              <button type="button" class="tool-btn icon-only web-btn" id="webBtn" tabindex="-1" aria-pressed="false" hidden></button>
              <span class="segmented" id="modeSwitch" role="radiogroup">
                <button type="button" role="radio" data-mode="claude" aria-checked="true"><span>Claude</span></button>
                <button type="button" role="radio" data-mode="chatgpt" aria-checked="false"><span>ChatGPT</span></button>
                <button type="button" role="radio" data-mode="grok" aria-checked="false"><span>Grok</span></button>
                <button type="button" role="radio" data-mode="gemini" aria-checked="false"><span>Gemini</span></button>
                <button type="button" role="radio" data-mode="perplexity" aria-checked="false"><span>Perplexity</span></button>
              </span>
            </span>
            <span class="spacer"></span>
            <button type="button" class="tool-btn model-btn" id="modelBtn" title="Choisir l’IA et le modèle" aria-haspopup="menu"></button>
            <button type="button" class="tool-btn icon-only mic-btn" id="micBtn" title="Dicter (Ctrl M) · clic long : conversation vocale" aria-label="Dicter">
              <svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg>
            </button>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Envoyer">
              <svg viewBox="0 0 24 24" class="i-send"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
              <svg viewBox="0 0 24 24" class="i-stop"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            </button>
          </div>
        </form>
        <div class="home-chips" id="homeChips" hidden></div>
        <div class="usage-row">
          <button type="button" class="usage-bar" id="usageBar" title="Utilisation de tes abonnements"></button>
          <div class="statusline" id="statusline"></div>
          <p class="composer-hint" id="hint"></p>
          <p class="disclaimer" id="disclaimer">Les IA peuvent se tromper. Vérifie les réponses importantes.</p>
        </div>
      </footer>
    </main>

    <aside class="inspector" id="inspector" aria-label="Panneau de travail" hidden>
      <div class="insp-head">
        <div class="insp-tabs seg" id="inspTabs" role="tablist">
          <button type="button" data-insp="tasks" class="on">Tâches</button>
          <button type="button" data-insp="changes">Modifs</button>
          <button type="button" data-insp="git">Git</button>
          <button type="button" data-insp="session">Session</button>
        </div>
        <button class="icon-btn sm" id="inspClose" type="button" aria-label="Fermer le panneau"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="insp-body" id="inspBody"></div>
    </aside>
  </div>

  <!-- Palette de commandes -->
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Palette de commandes" hidden>
    <div class="palette-card">
      <label class="palette-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-5-6-5M12 19h8"/></svg>
        <input id="paletteInput" type="text" placeholder="Commande, conversation, skill…" autocomplete="off" spellcheck="false">
        <kbd>Échap</kbd>
      </label>
      <div class="palette-list" id="paletteList"></div>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <!-- Fenêtre (réglages, skills, galerie) -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-card" id="modalCard">
      <aside class="modal-nav" id="modalNav"></aside>
      <section class="modal-main">
        <header class="modal-head">
          <h2 id="modalTitle"></h2>
          <button class="icon-btn" id="modalClose" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </header>
        <div class="modal-body" id="modalBody"></div>
        <footer class="modal-foot" id="modalFoot" hidden></footer>
      </section>
    </div>
  </div>

  <!-- Aperçu plein écran d'un design -->
  <div class="design-viewer" id="designViewer" data-device="desktop" hidden>
    <div class="dv-bar">
      <b class="dv-title">Design</b>
      <div class="seg dv-devices">
        <button type="button" data-dv-device="desktop" class="on" title="Bureau"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></svg></button>
        <button type="button" data-dv-device="tablet" title="Tablette"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
        <button type="button" data-dv-device="phone" title="Mobile"><svg viewBox="0 0 24 24"><rect x="7.5" y="3" width="9" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
      </div>
      <div class="seg dv-tabs">
        <button type="button" data-dv-tab="preview" class="on">Aperçu</button>
        <button type="button" data-dv-tab="code">Code</button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" data-dv-copy title="Copier le code"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></svg></button>
      <button type="button" class="icon-btn" data-dv-full title="Plein écran / panneau"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button type="button" class="icon-btn" data-dv-reload title="Recharger"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.6M20 4v4.6h-4.6"/></svg></button>
      <a class="icon-btn" data-dv-download href="#" download title="Télécharger le HTML"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></a>
      <button type="button" class="icon-btn" data-dv-close title="Fermer (Échap)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <pre class="dv-code" hidden><code></code></pre>
    <div class="dv-stage"><iframe sandbox="allow-scripts allow-forms allow-popups allow-modals" title="Aperçu du design"></iframe></div>
  </div>

  <div class="lightbox" id="lightbox" hidden><figure><img alt=""><figcaption></figcaption></figure></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
