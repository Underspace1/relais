<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Relais</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try {
      const p = JSON.parse(localStorage.getItem('relais-prefs') || '{}');
      if (p.theme && p.theme !== 'auto') document.documentElement.dataset.theme = p.theme;
      if (p.fontSize) document.documentElement.dataset.size = p.fontSize;
    } catch {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <div class="brand">
          <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-name">Relais</span>
        </div>
        <button class="icon-btn" id="newChatIcon" type="button" aria-label="Nouvelle conversation" title="Nouvelle conversation (Ctrl K)">
          <svg viewBox="0 0 24 24"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </div>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Rechercher" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </label>

      <nav class="side-nav">
        <button class="nav-item" id="newChat" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nouvelle conversation</span>
        </button>
        <button class="nav-item" id="openProjects" type="button">
          <svg viewBox="0 0 24 24"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span>Projets</span>
        </button>
        <button class="nav-item" id="openSkills" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"/></svg>
          <span>Skills</span><span class="count" id="skillCount"></span>
        </button>
        <button class="nav-item" id="openGallery" type="button">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8 8.5"/></svg>
          <span>Images</span>
        </button>
        <button class="nav-item" id="openDesigns" type="button">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9h17M9 9v10.5"/></svg>
          <span>Designs</span>
        </button>
      </nav>

      <div class="conv-list" id="convList" aria-label="Conversations"></div>

      <div class="side-foot">
        <button class="conn-card" id="connCard" type="button" data-open-settings="connexions"></button>
        <button class="nav-item" id="openSettings" type="button" data-open-settings="general">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Réglages</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="project-btn" id="projectBtn" type="button" title="Choisir le projet sur lequel les IA travaillent"></button>
        <h1 class="conv-title" id="convTitle">Nouvelle conversation</h1>
        <div class="top-agents" id="topAgents"></div>
      </header>

      <section class="thread" id="thread">
        <div class="thread-inner" id="threadInner"></div>
      </section>

      <footer class="composer-wrap">
        <div class="popover" id="popover" hidden></div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="chips" id="chips" hidden></div>
          <textarea id="input" rows="1" placeholder="Écris à Claude…" aria-label="Message"></textarea>
          <div class="toolbar">
            <button type="button" class="tool-btn" id="relayBtn" title="Relais : faire travailler une autre IA">
              <svg viewBox="0 0 24 24"><path d="M5 12h4l2-5 2 10 2-5h4"/></svg><span>Relais</span>
            </button>
            <button type="button" class="tool-btn" id="skillBtn" title="Skills (/)">
              <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"/></svg><span>Skill</span>
            </button>
            <button type="button" class="tool-btn perm-btn" id="permBtn" hidden></button>
            <span class="spacer"></span>
            <button type="button" class="tool-btn model-btn" id="modelBtn" title="Choisir le modèle"></button>
            <div class="segmented" id="modeSwitch" role="radiogroup" aria-label="Destinataire">
              <button type="button" role="radio" data-mode="claude" aria-checked="true"><i class="dot" data-agent="claude"></i><span>Claude</span></button>
              <button type="button" role="radio" data-mode="chatgpt" aria-checked="false"><i class="dot" data-agent="chatgpt"></i><span>ChatGPT</span></button>
              <button type="button" role="radio" data-mode="grok" aria-checked="false"><i class="dot" data-agent="grok"></i><span>Grok</span></button>
            </div>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Envoyer">
              <svg viewBox="0 0 24 24" class="i-send"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
              <svg viewBox="0 0 24 24" class="i-stop"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            </button>
          </div>
        </form>
        <div class="usage-row">
          <button type="button" class="usage-bar" id="usageBar" title="Utilisation de tes abonnements"></button>
          <p class="composer-hint" id="hint"></p>
        </div>
      </footer>
    </main>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <!-- Fenêtre (réglages, skills, galerie) -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-card" id="modalCard">
      <aside class="modal-nav" id="modalNav"></aside>
      <section class="modal-main">
        <header class="modal-head">
          <h2 id="modalTitle"></h2>
          <button class="icon-btn" id="modalClose" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </header>
        <div class="modal-body" id="modalBody"></div>
        <footer class="modal-foot" id="modalFoot" hidden></footer>
      </section>
    </div>
  </div>

  <!-- Aperçu plein écran d'un design -->
  <div class="design-viewer" id="designViewer" data-device="desktop" hidden>
    <div class="dv-bar">
      <b class="dv-title">Design</b>
      <div class="seg dv-devices">
        <button type="button" data-dv-device="desktop" class="on" title="Bureau"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></svg></button>
        <button type="button" data-dv-device="tablet" title="Tablette"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
        <button type="button" data-dv-device="phone" title="Mobile"><svg viewBox="0 0 24 24"><rect x="7.5" y="3" width="9" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" data-dv-reload title="Recharger"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.6M20 4v4.6h-4.6"/></svg></button>
      <a class="icon-btn" data-dv-download href="#" download title="Télécharger le HTML"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></a>
      <button type="button" class="icon-btn" data-dv-close title="Fermer (Échap)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="dv-stage"><iframe sandbox="allow-scripts allow-forms allow-popups allow-modals" title="Aperçu du design"></iframe></div>
  </div>

  <div class="lightbox" id="lightbox" hidden><figure><img alt=""><figcaption></figcaption></figure></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
